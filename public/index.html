<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ET N35 Ingeniero Eduardo Latzina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styleLogin.css">
<link rel="icon" href="img/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="styleInstitucional.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
</div>

<div class="container">
  <div class="logo">
    <img src="img/logo.jpg" alt="Escudo oficial ET N°35 Ing. Eduardo Latzina" class="logo-img">
    <h1>ET N°35</h1>
    <p class="logo-sub">Escuela Técnica N° 35 D.E. 18 &bull; Ing. Eduardo Latzina</p>
    <div class="logo-badge-pill">Gestión Académica</div>
  </div>

  <form id="loginForm">
    <div class="field">
      <label for="dni">DNI</label>
      <input id="dni" type="text" inputmode="numeric" pattern="[0-9]*"
             placeholder="Sin puntos, solo números" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit"><span>Ingresar</span></button>
  </form>

  <div class="footer">Sistema institucional escolar</div>
</div>

<script src="api.js"></script>
<script src="scriptLogin.js"></script>
</body>
</html>
