<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilla</title>
  <link rel="stylesheet" href="styleHistorial.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- SheetJS: lectura y escritura de Excel desde el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="stylePlanilla.css">
<link rel="icon" href="img/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="styleInstitucional.css">
</head>

<body>

<div class="header">
  <div class="header-brand">
    <img src="img/logo.jpg" alt="Escudo de ET N°35" class="header-logo-img">
  <div class="left-header">
    <h1 id="materiaTitulo">Materia</h1>
    <p>ET N°35 Ingeniero Eduardo Latzina</p>
    <span id="materiaInfo" class="header-materia-info"></span>
  </div>
  </div>
  <div class="acciones-planilla header-actions">
  <button class="volver-btn" id="historialBtn" type="button" hidden>Historial de notas</button>
  <button class="volver-btn" onclick="history.back()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Volver
  </button>
  </div>
</div>

<div class="container">

  <!-- Formulario de evaluaciones regulares -->
  <div class="global-form" id="globalForm" style="display:none;">
    <h2>Carga global de notas</h2>
    <div class="form-grid">
      <input type="text" id="globalDescripcion" placeholder="Tema / descripción">
      <select id="globalTipo">
        <option value="Examen escrito">Examen escrito</option>
        <option value="Oral">Oral</option>
        <option value="TP">Trabajo práctico</option>
        <option value="Participacion +0.5">Participación +0.5</option>
        <option value="Participacion +1">Participación +1</option>
        <option value="Participacion -0.5">Participación -0.5</option>
      </select>
      <select id="globalBimestre">
        <option value="1">1er Bimestre</option>
        <option value="2">2do Bimestre</option>
        <option value="3">3er Bimestre</option>
        <option value="4">4to Bimestre</option>
      </select>
    </div>
    <div class="acum-row">
      <label>
        <input type="checkbox" id="globalEsAcumulativo" onchange="actualizarSelectOrigen()">
        Esta evaluación es acumulativa de una anterior
      </label>
      <div id="origenContenedor" style="display:none;">
        <select id="globalEvaluacionOrigen"></select>
      </div>
    </div>
    <div id="globalAlumnos"></div>
    <div class="import-toolbar" style="margin-top: 20px;">
      <button class="global-btn" onclick="guardarGlobal()">Guardar evaluación global</button>

      <!-- Botones de importación Excel (solo si tiene permiso de escritura) -->
      <button class="template-btn" id="btnDescargarPlantilla" onclick="descargarPlantilla()" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Descargar plantilla
      </button>
      <button class="import-btn" id="btnImportarExcel" onclick="document.getElementById('inputExcel').click()" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        Importar desde Excel
      </button>
      <input type="file" id="inputExcel" accept=".xlsx,.xls,.csv" onchange="importarExcel(event)">
    </div>

    <!-- Panel de resultados de importación -->
    <div class="import-resultado" id="importResultado"></div>
  </div>

  <!-- Tabla de planilla -->
  <div class="table-container">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Alumno</th>
            <th>1er Bimestre</th>
            <th>2do Bimestre</th>
            <th>1er Cuatrimestre</th>
            <th>3er Bimestre</th>
            <th>4to Bimestre</th>
            <th>2do Cuatrimestre</th>
            <th>1er Cierre (Dic.)</th>
            <th>2do Cierre (Feb.)</th>
            <th>Nota Final</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Formulario de cierres (se renderiza dinámicamente debajo de la tabla) -->
  <div class="cierre-form" id="cierreForm" style="display:none;"></div>

</div>

<script src="api.js"></script>
<script src="scriptPlanilla.js"></script>
<script src="scriptHistorial.js"></script>

</body>
</html>
